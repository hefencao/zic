name: zic
description: zic Flutter application.
publish_to: none
version: 0.31.0+322
resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  domain:
    path: ../../packages/domain
  downloads:
    path: ../../packages/downloads
  downloads_bridge:
    path: ../../packages/downloads_bridge
  catalog:
    path: ../../packages/catalog
  plugin_host:
    path: ../../packages/plugin_host
  plugin_host_bridge:
    path: ../../packages/plugin_host_bridge
  network_bridge:
    path: ../../packages/network_bridge
  local_media:
    path: ../../packages/local_media
  local_media_ui:
    path: ../../packages/local_media_ui
  pipeline_native:
    path: ../../packages/pipeline_native
  pipeline_runtime:
    path: ../../packages/pipeline_runtime
  file_selector: ^1.1.0
  resource_cache:
    path: ../../packages/resource_cache
  reader_runtime:
    path: ../../packages/reader_runtime
  storage_bridge:
    path: ../../packages/storage_bridge
  telemetry:
    path: ../../packages/telemetry

dev_dependencies:
  bridge:
    path: ../../packages/bridge
  pipeline:
    path: ../../packages/pipeline
  reader:
    path: ../../packages/reader
  transport:
    path: ../../packages/transport
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/demo/comic.json
    - assets/demo/chapter_001.json
    - assets/demo/chapter_media_pipeline.json
    - assets/demo/pages/
    - assets/demo/animated/
