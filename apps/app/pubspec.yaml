name: zic
description: zic Flutter application.
publish_to: none
version: 0.31.0+54
resolution: workspace

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  domain:
    path: ../../packages/domain
  downloads:
    path: ../../packages/downloads
  downloads_bridge:
    path: ../../packages/downloads_bridge
  catalog:
    path: ../../packages/catalog
  plugin_host:
    path: ../../packages/plugin_host
  plugin_host_bridge:
    path: ../../packages/plugin_host_bridge
  bridge:
    path: ../../packages/bridge
  texture_bridge:
    path: ../../packages/texture_bridge
  local_media:
    path: ../../packages/local_media
  runtime_bridge:
    path: ../../packages/runtime_bridge
  file_selector: ^1.0.3
  pipeline:
    path: ../../packages/pipeline
  resource_cache:
    path: ../../packages/resource_cache
  reader:
    path: ../../packages/reader
  sessions:
    path: ../../packages/sessions
  storage:
    path: ../../packages/storage
  storage_bridge:
    path: ../../packages/storage_bridge
  telemetry:
    path: ../../packages/telemetry
  transport:
    path: ../../packages/transport

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/demo/comic.json
    - assets/demo/chapter_001.json
    - assets/demo/chapter_media_pipeline.json
    - assets/demo/pages/
    - assets/demo/animated/
