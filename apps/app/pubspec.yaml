name: zic
description: zic Flutter application.
publish_to: none
version: 0.18.3+21
resolution: workspace

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  domain:
    path: ../../packages/domain
  catalog:
    path: ../../packages/catalog
  bridge:
    path: ../../packages/bridge
  file_selector: ^1.0.3
  pipeline:
    path: ../../packages/pipeline
  reader:
    path: ../../packages/reader
  sessions:
    path: ../../packages/sessions
  telemetry:
    path: ../../packages/telemetry

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/demo/comic.json
    - assets/demo/chapter_001.json
    - assets/demo/pages/
    - assets/demo/animated/
