name: comic_translation
description: Comic OCR, text translation and read-only image overlays migrated from vibevenera.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  dio: ^5.9.0
  sqlite3: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/opencc.txt
  plugin:
    platforms:
      android:
        package: dev.zic.comic_translation
        pluginClass: ComicTranslationPlugin
