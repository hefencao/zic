name: local_media_bridge
description: Scoped-storage document tree access for local zic media imports.
version: 0.18.3
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.zic.localmedia
        pluginClass: LocalMediaBridgePlugin
