name: network_bridge
description: Shared Android browser, cookie, challenge, and native network capabilities for zic.
version: 0.31.0
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.zic.network
        pluginClass: NetworkBridgePlugin
