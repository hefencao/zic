name: texture_bridge
description: Flutter texture presentation for retained zic native frames.
version: 0.31.0
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  bridge:
    path: ../bridge

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.zic.texture
        pluginClass: TextureBridgePlugin
