name: runtime_bridge
description: Runtime network and power environment signals for zic scheduling.
version: 0.28.1
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.zic.runtime
        pluginClass: RuntimeBridgePlugin
