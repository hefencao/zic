group = "dev.zic.pluginhost"
version = "1.0"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.7.3"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

repositories {
    google()
    mavenCentral()
    maven { url "https://jitpack.io" }
}

android {
    namespace = "dev.zic.pluginhost"
    compileSdk = 35

    defaultConfig {
        minSdk = 21
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // The runtime executes current Keiyoushi/Mihon 1.6 APKs in the isolated
    // service process. Keep the extension ABI and its host-provided common
    // libraries pinned to the revisions used by the upstream repository.
    runtimeOnly "com.github.keiyoushi:extensions-lib:6e0c96cea8"
    runtimeOnly "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.4.10"
    runtimeOnly "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
    runtimeOnly "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    runtimeOnly "com.github.null2264.injekt:injekt-core:4135455a2a"
    runtimeOnly "io.reactivex:rxjava:1.3.8"
    runtimeOnly "org.jetbrains.kotlinx:kotlinx-serialization-protobuf:1.11.0"
    runtimeOnly "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
    runtimeOnly "org.jetbrains.kotlinx:kotlinx-serialization-json-okio:1.11.0"
    runtimeOnly "org.jsoup:jsoup:1.22.2"
    runtimeOnly "org.jspecify:jspecify:1.0.0"
    runtimeOnly "com.squareup.okhttp3:okhttp:5.4.0"
    runtimeOnly "com.squareup.okhttp3:okhttp-brotli:5.4.0"
    runtimeOnly "com.squareup.okhttp3:okhttp-zstd:5.4.0"
    runtimeOnly "com.squareup.zstd:zstd-kmp-okio:0.4.0"
    runtimeOnly "com.github.zhanghai.quickjs-java:quickjs-android:547f5b1597"

    // Common extension runtime dependencies that are expected to be supplied
    // by Mihon. They are deliberately runtime-only: the bridge talks to the
    // extension ABI reflectively, so the baseline Kotlin compiler never needs
    // to consume newer upstream Kotlin metadata.
    runtimeOnly "com.google.code.gson:gson:2.11.0"
    runtimeOnly "androidx.preference:preference-ktx:1.2.1"

    testImplementation "junit:junit:4.13.2"
}
