name: plugin_host_bridge
description: Android metadata, dedicated-process bootstrap, and runtime transport for external comic plugins.
version: 0.31.0
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  network_bridge:
    path: ../network_bridge
  plugin_host:
    path: ../plugin_host
  rhttp: 0.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.zic.pluginhost
        pluginClass: PluginHostBridgePlugin
