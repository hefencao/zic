name: reader_runtime
description: Reader presentation and observation adapter for Pipeline-owned sessions.
version: 0.31.0
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  domain:
    path: ../domain
  pipeline:
    path: ../pipeline
  pipeline_runtime:
    path: ../pipeline_runtime
  reader:
    path: ../reader
  telemetry:
    path: ../telemetry

dev_dependencies:
  sessions:
    path: ../sessions
  storage:
    path: ../storage
  transport:
    path: ../transport
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.zic.readerruntime
        pluginClass: ReaderRuntimePlugin
