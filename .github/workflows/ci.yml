name: ci

on:
  push:
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: ./tool/bootstrap_platforms.sh
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed apps packages
      - run: ./tool/analyze.sh
      - name: Test pure Dart packages
        run: ./tool/test_dart.sh
      - name: Test Flutter packages
        run: ./tool/test_flutter.sh
      - name: Build split Android debug APKs
        run: ./tool/build_android.sh debug
      - run: python3 tool/check_repo.py
      - name: Check native C header
        run: ./tool/check_native_header.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install libwebp development files
        run: sudo apt-get update && sudo apt-get install -y libwebp-dev pkg-config
      - run: ./tool/check_webp.sh
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
