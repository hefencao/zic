name: ci

on:
  push:
  pull_request:

jobs:
  flutter:
    needs: android-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: ./tool/bootstrap_platforms.sh
      - run: flutter pub get
      - name: Check Dart structure
        run: python3 tool/check_dart_structure.py
      - run: ./tool/analyze.sh
      - name: Test pure Dart packages
        run: ./tool/test_dart.sh
      - name: Test Flutter packages
        run: ./tool/test_flutter.sh
      - name: Download source-built Android native libraries and notices
        uses: actions/download-artifact@v4
        with:
          name: android-native
          path: apps/app/android/app/src/main
      - name: Download pinned Android translation runtime
        uses: actions/download-artifact@v4
        with:
          name: android-translation-runtime
          path: .deps/comic_translation_native/runtime
      - name: Validate staged Android native layout
        run: ./tool/check_android_native.sh
      - name: Build split Android debug APKs without native dependency rebuild
        run: ZIC_ANDROID_NATIVE=0 ./tool/build_android.sh debug
      - name: Verify Android translation APK closure
        run: python3 tool/check_android_translation.py --apk apps/app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
      - run: python3 tool/check_repo.py
      - name: Check native C header
        run: ./tool/check_native_header.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install source-build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Build pinned libwebp source and run native tests
        run: ./tool/test_rust.sh
      - name: Run libwebp source smoke
        run: ./tool/check_webp.sh

  android-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install source-build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Resolve Android NDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_NDK_LATEST_HOME:-}" && -d "$ANDROID_NDK_LATEST_HOME" ]]; then
            NDK="$ANDROID_NDK_LATEST_HOME"
          else
            SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            [[ -n "$SDK" ]] || { echo "Android SDK is unavailable" >&2; exit 1; }
            NDK="$(find "$SDK/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -1)"
            if [[ -z "$NDK" ]]; then
              yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"
              NDK="$SDK/ndk/27.0.12077973"
            fi
          fi
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
      - name: Build media_core and libwebp from source for Android ABIs
        run: ./tool/build_android_native.sh release
      - name: Validate Android native layout
        run: ./tool/check_android_native.sh
      - name: Prepare pinned Android translation toolchain
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?}}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108" "cmake;3.22.1"
      - name: Build pinned Android translation dependencies
        run: python3 tool/prepare_translation_android.py
      - name: Upload pinned Android translation runtime
        uses: actions/upload-artifact@v4
        with:
          name: android-translation-runtime
          path: .deps/comic_translation_native/runtime/
          if-no-files-found: error
          retention-days: 1
      - name: Upload source-built Android native libraries and notices
        uses: actions/upload-artifact@v4
        with:
          name: android-native
          path: |
            apps/app/android/app/src/main/jniLibs/
            apps/app/android/app/src/main/assets/third_party/libwebp/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
