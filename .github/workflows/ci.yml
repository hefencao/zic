name: ci

on:
  push:
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: ./tool/bootstrap_platforms.sh
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed apps packages
      - run: ./tool/analyze.sh
      - name: Test pure Dart packages
        run: ./tool/test_dart.sh
      - name: Test Flutter packages
        run: ./tool/test_flutter.sh
      - name: Build Android debug APK
        working-directory: apps/app
        run: flutter build apk --debug
      - run: python3 tool/check_repo.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
