name: ci

on:
  push:
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed apps packages
      - run: flutter analyze
      - name: Test pure Dart packages
        run: |
          for package_dir in \
            packages/domain \
            packages/catalog \
            packages/telemetry \
            packages/transport \
            packages/storage \
            packages/testkit \
            packages/pipeline \
            packages/sessions \
            packages/bridge; do
            (cd "$package_dir" && dart test)
          done
      - name: Test Flutter packages
        run: |
          for package_dir in \
            packages/reader \
            apps/app; do
            (cd "$package_dir" && flutter test)
          done
      - run: python3 tool/check_repo.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
